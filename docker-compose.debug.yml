services:
  reverse-proxy:
    env_file:
      - path: ./.env.dev
        required: false
    volumes:
      - ./deploy/nginx/default.debug.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/ssl/said-diplom/certificate.crt:/etc/ssl/said-diplom/certificate.crt:ro
      - /etc/ssl/said-diplom/certificate.key:/etc/ssl/said-diplom/certificate.key:ro
      - /etc/ssl/said-diplom/certificate_ca.crt:/etc/ssl/said-diplom/certificate_ca.crt:ro

  frontend:
    env_file:
      - path: ./frontend/.env.dev
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

  backend:
    build:
      args:
        COMPOSER_INSTALL_ARGS: --no-interaction --prefer-dist --optimize-autoloader
    env_file:
      - path: ./backend/.env.dev
        required: false
    environment: &backend-debug-environment
      APP_ENV: local
      APP_DEBUG: "true"
      TELESCOPE_ENABLED: "true"
      TELESCOPE_PATH: telescope
      LARAVEL_OPTIMIZE: "false"
      LOG_LEVEL: debug
      SESSION_SECURE_COOKIE: "true"

  queue:
    build:
      args:
        COMPOSER_INSTALL_ARGS: --no-interaction --prefer-dist --optimize-autoloader
    env_file:
      - path: ./backend/.env.dev
        required: false
    environment:
      <<: *backend-debug-environment

  scheduler:
    build:
      args:
        COMPOSER_INSTALL_ARGS: --no-interaction --prefer-dist --optimize-autoloader
    env_file:
      - path: ./backend/.env.dev
        required: false
    environment:
      <<: *backend-debug-environment

  reverb:
    build:
      args:
        COMPOSER_INSTALL_ARGS: --no-interaction --prefer-dist --optimize-autoloader
    env_file:
      - path: ./backend/.env.dev
        required: false
    environment:
      <<: *backend-debug-environment
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
